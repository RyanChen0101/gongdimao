<style>
/* Layout: phone-first app shell — sticky header, single column, fixed bottom tab bar; becomes left rail + 2-col dashboard on desktop */
:root{
  --bg:#ECEEEA; --surface:#FFFFFF; --surface-2:#F4F5F2; --line:#D8DCD5;
  --ink:#1B221F; --ink-2:#525C56; --ink-3:#848D87;
  --accent:#2C5E4F; --accent-ink:#FFFFFF; --accent-soft:#DCE8E2;
  --brand:#C4862A; --brand-soft:#F4E5CB;
  --ok:#2E7A4E; --ok-soft:#DBEEE1; --warn:#A86D12; --warn-soft:#F5E8CF; --bad:#BC3E2A; --bad-soft:#F7DFD9;
  --mat:#3A6896; --mat-soft:#DDE6F1; --war:#7A4E9A; --war-soft:#EEE4F5; --buy:#2F7A78; --buy-soft:#DAEDEC;
  --shadow:0 1px 2px rgba(20,30,25,.06),0 4px 14px rgba(20,30,25,.06);
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1B201E; --surface-2:#222826; --line:#323A36;
  --ink:#E7ECE9; --ink-2:#A8B1AC; --ink-3:#77817B;
  --accent:#72B59D; --accent-ink:#0E1814; --accent-soft:#1E3830;
  --brand:#E2A64C; --brand-soft:#3A2E1A;
  --ok:#62C08A; --ok-soft:#1B3325; --warn:#E2A64C; --warn-soft:#3A2E1A; --bad:#EC7A65; --bad-soft:#3E231E;
  --mat:#86AADA; --mat-soft:#1F2C3D; --war:#C7A6E2; --war-soft:#2E2340; --buy:#7CC9C6; --buy-soft:#1C3534; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B201E; --surface-2:#222826; --line:#323A36;
  --ink:#E7ECE9; --ink-2:#A8B1AC; --ink-3:#77817B;
  --accent:#72B59D; --accent-ink:#0E1814; --accent-soft:#1E3830;
  --brand:#E2A64C; --brand-soft:#3A2E1A;
  --ok:#62C08A; --ok-soft:#1B3325; --warn:#E2A64C; --warn-soft:#3A2E1A; --bad:#EC7A65; --bad-soft:#3E231E;
  --mat:#86AADA; --mat-soft:#1F2C3D; --war:#C7A6E2; --war-soft:#2E2340; --buy:#7CC9C6; --buy-soft:#1C3534; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:0}
svg.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{display:flex;align-items:center;gap:10px;min-height:56px;padding-inline:16px;max-width:980px;margin:0 auto}
.top h1{font-size:19px;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-wrap:balance}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}
.iconbtn:active{background:var(--surface-2)}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.brand b{font-size:20px;font-weight:900;letter-spacing:.04em}
.brand small{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.08em;margin-top:-2px}
main{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:8px calc(var(--nav-h) + 28px)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h);max-width:560px;margin:0 auto}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--ink-3);text-decoration:none;cursor:pointer;position:relative}
.nav a.on{color:var(--accent);font-weight:700}
.nav a .badge{position:absolute;top:8px;left:calc(50% + 6px)}
.nav .add{display:grid;place-items:center}
.nav .add span{width:52px;height:52px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);margin-top:-14px}
.nav .add svg.i{width:26px;height:26px;stroke-width:2.2}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;line-height:1}

/* type */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-3)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 2px 10px}
.sec h2{font-size:16px;font-weight:700;margin:0}
.sec a{font-size:13px;color:var(--accent);cursor:pointer;font-weight:500}
.muted{color:var(--ink-3)}
.stack{display:flex;flex-direction:column;gap:10px}

/* hello */
.hello{padding:6px 2px 4px}
.hello h2{font-size:24px;font-weight:900;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.stat .n{font-family:var(--f-num);font-size:26px;line-height:1.1;font-weight:500}
.stat .l{font-size:12px;color:var(--ink-2)}
.stat.alert .n{color:var(--bad)}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.site{padding:14px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
.site-h{display:flex;align-items:flex-start;gap:10px}
.site-h .t{flex:1;min-width:0}
.site-h .t b{display:block;font-size:16px;font-weight:700;line-height:1.35}
.site-h .t span{font-size:12.5px;color:var(--ink-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.work{display:flex;gap:8px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink-2)}
.work svg{margin-top:2px;color:var(--brand)}
.site-f{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3)}
.site-f .grow{flex:1}
.quick{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13.5px}

.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.p-phase{background:var(--accent-soft);color:var(--accent)}
.p-soon{background:var(--brand-soft);color:var(--warn)}
.p-done{background:var(--surface-2);color:var(--ink-3)}
.c-進度{background:var(--accent-soft);color:var(--accent)}
.c-問題{background:var(--bad-soft);color:var(--bad)}
.c-變更{background:var(--brand-soft);color:var(--warn)}
.c-驗收{background:var(--ok-soft);color:var(--ok)}
.c-材料{background:var(--mat-soft);color:var(--mat)}
.c-安全{background:var(--warn-soft);color:var(--warn)}
.c-保固{background:var(--war-soft);color:var(--war)}
.c-採購{background:var(--buy-soft);color:var(--buy)}
.s-todo{background:var(--brand-soft);color:var(--warn)}
.s-ordered{background:var(--mat-soft);color:var(--mat)}
.s-arrived{background:var(--ok-soft);color:var(--ok)}
.blist{display:flex;flex-direction:column;gap:6px}
.bitem{display:flex;gap:8px;align-items:flex-start;font-size:14.5px}
.bitem .bname{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:1px}
.bitem.done .bname{color:var(--ink-3);text-decoration:line-through}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{flex:1;min-height:38px;border-radius:8px;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.itcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.itcard .full{grid-column:1/-1;padding-right:44px}
.itcard input.in{padding:10px 12px}
.itcard .itx{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.itlist{display:flex;flex-direction:column;gap:8px}
.edited{font-size:11.5px;color:var(--ink-3)}
.brow{display:flex;gap:10px;align-items:center;min-height:44px}
.brow .bname{flex:1;min-width:0;overflow-wrap:anywhere;font-size:15px}
.brow.done .bt{color:var(--ink-3);text-decoration:line-through}
.ordtag{flex:none;min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-3);align-self:center}
.ordtag.on{background:var(--mat-soft);border-color:transparent;color:var(--mat);font-weight:700}
.mchk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);display:inline-grid;place-items:center;flex:none;color:transparent;margin-top:2px}
.mchk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mchk svg.i{width:12px;height:12px;stroke-width:3}
.bigbtn.warbtn{background:var(--war);color:#fff}

.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* todo rows */
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;min-height:56px}
.todo + .todo{border-top:1px solid var(--line)}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.todo .b{flex:1;min-width:0;cursor:pointer}
.todo .b p{margin:0;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.todo.done .b p{color:var(--ink-3);text-decoration:line-through}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--ink-3);margin-top:3px}
.due-over{color:var(--bad);font-weight:700}
.due-today{color:var(--warn);font-weight:700}

/* records */
.rec{padding:13px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.rec-h{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.rec-h .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec p{margin:0;font-size:15px;overflow-wrap:anywhere}
.thumbs{display:flex;gap:6px;overflow-x:auto}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:9px;flex:none;background:var(--surface-2)}
.day{font-size:13px;font-weight:700;color:var(--ink-2);margin:18px 2px 8px;display:flex;gap:8px;align-items:baseline}
.day .num{font-size:12px;color:var(--ink-3);font-weight:500}

/* filters */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:12px;padding:0 12px;height:46px;margin:6px 0 10px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 14px;border-radius:19px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap;flex:none;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}

/* project detail */
.ph{padding:16px;display:flex;flex-direction:column;gap:12px}
.ph h2{margin:0;font-size:21px;font-weight:900;text-wrap:balance}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.phases{display:flex;gap:3px;margin-top:2px}
.phases div{flex:1;min-width:0;text-align:center}
.phases i{display:block;height:6px;border-radius:3px;background:var(--surface-2)}
.phases .past i{background:color-mix(in srgb,var(--accent) 45%,var(--surface-2))}
.phases .cur i{background:var(--accent)}
.phases span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden}
.phases .cur span{color:var(--accent);font-weight:700}
.tabs{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px;margin:16px 0 4px}
.tabs button{flex:1;height:40px;border-radius:9px;font-size:14px;color:var(--ink-2)}
.tabs button.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px}
.ghost{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:500;width:100%}

/* form */
.f{display:flex;flex-direction:column;gap:20px;padding-top:4px}
.people{display:flex;flex-direction:column;gap:20px}
.f label.h{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;font-weight:700;margin:0 2px 8px}
.f label.h em{font-style:normal;font-weight:400;font-size:12px;color:var(--ink-3)}
.photo-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbtn{height:84px;border-radius:14px;border:1.5px dashed var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:14px;color:var(--ink-2);position:relative;overflow:hidden}
.pbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.pbtn.cam{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:8px}
.pgrid div{position:relative;aspect-ratio:1;max-width:100%}
.pgrid img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.pgrid button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:14px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
textarea.in,input.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;outline:0}
textarea.in{min-height:96px;resize:vertical;line-height:1.5}
textarea.in:focus,input.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.opt{min-height:44px;padding:0 15px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.opt.cat.on{border-color:currentColor}
.proj-sel{display:flex;gap:8px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 4px;scrollbar-width:none}
.proj-sel::-webkit-scrollbar{display:none}
.proj-sel button{flex:none;width:150px;text-align:left;padding:10px 12px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);min-height:62px}
.proj-sel button b{display:block;font-size:14px;line-height:1.3}
.proj-sel button span{font-size:12px;color:var(--ink-3)}
.proj-sel button.on{border-color:var(--accent);background:var(--accent-soft)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:12px;padding:12px 14px;min-height:56px}
.tg{width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tg.on{background:var(--bad)} .tg.on::after{transform:translateX(20px)}

 const R=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)P(x+i,y+j,c)};
 const D=(cx,cy,r,c)=>{for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++)if(i*i+j*j<=r*r+r*.6)P(cx+i,cy+j,c)};
 const dark=(c,k)=>{const n=parseInt(c.slice(1),16);const f=v=>Math.round(v*k).toString(16).padStart(2,'0');return '#'+f(n>>16)+f(n>>8&255)+f(n&255)};
 const draw=(sp,ox,oy,map)=>sp.forEach((row,y)=>[...row].forEach((ch,x)=>{if(ch!=='.')P(ox+x,oy+y,map(ch,x,y))}));
 BGPX[look.bg||'bg_plain'](R,P,D);

 const furMap=part=>(ch,x,y)=>{
  if(ch==='o')return F.ol;
  const cl=look.body&&(part==='body'||part==='loaf')&&'bsc'.includes(ch)&&!(loaf&&y===8&&x<9)?CLOTH[look.body](y,x,loaf):null;
  if(cl)return cl;
  const pt=F.patch&&'bs'.includes(ch)?F.patch(part,x,y):null;
  return {b:pt||F.base,s:pt||F.stripe,c:F.chest,p:F.pink,k:F.blush,e:F.eye,h:F.hi}[ch]};
 const bx=21,by=37,lx=18,ly=42;
 // shadow
 for(let i=0;i<(loaf?34:24);i++){const x=(loaf?lx-1:bx-1)+i;P(x,52,dark(buf[52*N+x],.86));P(x,53,dark(buf[53*N+x],.93))}
 if(loaf){

 }else{

  draw(body,bx,by,furMap('body'));
 }
 const propPos=loaf?{tape:[37,33],level:[33,38],roller:[44,25]}:{tape:[48,44],level:[45,48],roller:[50,39]};
 if(look.prop&&SP[look.prop]){const [x,y]=propPos[look.prop];draw(SP[look.prop],x,y,ch=>({o:OLC,y:'#F4C02E',t:'#F7E08A',G:'#3F8F5F',l:'#D4EF8E',R:'#6FA58E',h:'#9A6A3E'})[ch])}
 const hx=loaf?lx-3:bx,hy=loaf?ly-11:by-14;
 let head=SP.head;
 const setp=(rows,pts,ch)=>{rows=rows.slice();pts.forEach(([x,y])=>{rows[y]=rows[y].slice(0,x)+ch+rows[y].slice(x+1)});return rows};
 if(look.pose==='wave'){head=setp(head,[[16,8],[17,8],[16,9],[17,9]],'b');head=setp(head,[[15,9],[16,8],[17,8],[18,9]],'o')}
 if(loaf){head=setp(head,[[4,8],[5,8],[4,9],[5,9],[16,8],[17,8],[16,9],[17,9]],'b');head=setp(head,[[3,8],[4,9],[5,9],[6,8],[15,8],[16,9],[17,9],[18,8]],'o')}
 draw(head,hx,hy,furMap('head'));
 if(look.face==='glasses'){const gc=look.fur==='fur_black'?'#E9C547':'#8A5A2B';draw(SP.glasses,hx,hy+7,()=>gc)}
 if(look.hat&&HATC[look.hat]){const c=HATC[look.hat];draw(SP.hard,hx-1,hy-2,ch=>({o:OLC,y:c[0],Y:c[1],L:c[2]})[ch])}
 if(look.hat==='beret')draw(SP.beret,hx+3,hy+1,ch=>({o:OLC,r:'#B8433A',R:'#8E2F28'})[ch]);
 if(look.pose==='wave')draw(SP.arm,bx+20,by-7,furMap('arm'));
 if(look.pose==='sign'){draw(SP.sign,bx+2,by+2,ch=>({o:OLC,w:'#FFF6E2',g:'#3F8F5F'})[ch]);draw(SP.paw,bx,by+1,furMap('paw'));draw(SP.paw,bx+18,by+1,furMap('paw'))}
 if(loaf){draw(SP.zzz,hx+21,hy-1,()=>'#6E7FA8');draw(SP.zzz.map(r=>r),hx+25,hy-6,()=>'#93A1C2')}
 // to PNG at 6x

 for(let y=0;y<N;y++)for(let x=0;x<N;x++){g.fillStyle=buf[y*N+x];g.fillRect(x*S,y*S,S,S)}

/* call after any change that can earn points */
function award(before,msg){
 const after=points().total,gain=after-before;
 const fresh=ITEMS.filter(i=>i.pts<=after&&!S.seen.includes(i.id));
 if(fresh.length){S.seen.push(...fresh.map(i=>i.id));saveTeam();const ot=document.querySelector('.toast');if(ot)ot.remove();clearTimeout(tt);
  const it=fresh[fresh.length-1];
  sheet(`<div class="celebrate">${catSVG(previewLook(it),200)}<div class="eyebrow" style="color:var(--warn)">團隊解鎖新造型</div><h3>「${it.name}」</h3><p class="muted" style="margin:0">${msg?esc(msg)+' · ':''}團隊累積 <b class="num">${after}</b> 點${fresh.length>1?`，一次解鎖 ${fresh.length} 項`:''}</p></div>
   <div class="sheet-actions"><button class="ghost" data-act="close">等等再說</button><button class="bigbtn" data-act="equip" data-v="${it.id}" data-s="${it.slot}" data-go="1">立刻換上</button></div>`);
  return true}
 const sep=msg?msg+(/[！!]$/.test(msg)?' ':'，'):'';
 if(gain>0)toast(`${sep}團隊 +${gain} 點`);
 else if(gain<0)toast(`${sep}團隊 ${gain} 點`);
 else if(msg)toast(msg);
 return false}

function urg(r){
 const p=proj(r.projectId)||{};let s=0;const why=[];
 if(r.urgent){s+=40;why.push('標記緊急')}
 if(r.due){const n=diff(r.due);
  if(n<0){s+=30+Math.min(20,-n*4);why.push(`逾期 ${-n} 天`)}
  else if(n===0){s+=25;why.push('今天到期')}
  else if(n===1){s+=12;why.push('明天到期')}
  else if(n<7)s+=4;}
 if(r.category==='安全'){s+=15;why.push('工安')}
 if(r.category==='問題'){s+=12;why.push('施工問題')}
 if(r.category==='變更'){s+=6;why.push('業主變更')}
 if(r.category==='保固'){s+=10;why.push('保固維修')}
 if(isBuy(r)&&r.due){const n=diff(r.due);if(n<=3&&r.items.some(i=>i.status==='todo')){s+=14;why.push('還沒下訂')}else if(n<0&&r.items.some(i=>i.status==='ordered')){s+=10;why.push('逾期未到貨')}}
 if(p.end&&p.phase!=='完工'&&diff(p.end)<=14&&diff(p.end)>=0){s+=8;why.push(`${diff(p.end)} 天後完工`)}
 if(p.today)s+=5;
 return {s,why}}

 }else if(AI.state==='off')ai='';
 else ai=`<div class="aicard"><div class="aih">${ic('spark')}<b>AI 總結今天該先做什麼</b></div>
   <p class="muted" style="margin:0;font-size:14px">AI 會讀完全部 ${list.length} 件待辦，考量工期、工安、業主變更與工班安排，排出處理順序並寫出每件的下一步。</p>

 return `${ai}

  <p class="hint" style="margin:-4px 2px 10px">排序依據：緊急標記、逾期天數、到期日、工安／施工問題、即將完工的工地。</p>
  <div class="card">${list.map((x,i)=>urgRow(x,i)).join('')}</div>`}
let aiCtl=null;
async function runAI(refresh){
 const sample=await getSample();
 if(!sample){AI.state='off';AI.err='';render();return}
 const list=ranked();
 const lines=list.map(x=>{const r=x.r,p=proj(r.projectId)||{};
  return JSON.stringify({id:r.id,工地:p.name,階段:p.phase,距完工天數:p.end?diff(p.end):null,今日施工:p.today||'無',分類:r.category,內容:r.text||'（只有照片）',負責人:r.assignee,記錄人:r.by,期限:r.due?`${r.due}（${rel(r.due)}）`:'未設定',緊急:!!r.urgent})}).join('\n');
 const prompt=`你是室內設計公司的資深工務經理。今天是 ${iso(TODAY)}（星期${WD[TODAY.getDay()]}）。以下是各工地尚未完成的待辦，每行一筆 JSON：
${lines}

請排出今天的處理優先順序。考量：工安與會擋住後續工序的問題最優先（例如封板前的管線、泥作重做）、已逾期或今天到期、業主變更需要回覆的時效、即將完工的工地、同一位師傅的工作可以順路安排。
只回覆一個 JSON 物件，使用繁體中文（台灣用語）：
{"summary":"2–3 句總結今天最該先處理的事與原因","order":[{"id":"待辦 id","reason":"為什麼排這個位置，20 字內","next":"具體下一步，20 字內"}]}
order 必須包含全部 ${list.length} 筆，依優先順序由高到低。`;
 AI.state='loading';AI.err='';render();
 aiCtl=new AbortController();
 try{
  const data=await sample.json(prompt,{signal:aiCtl.signal,cache:refresh?{gcTime:300000,refresh:true}:{gcTime:300000},onText:()=>{const el=document.getElementById('aiLive');if(el)el.textContent='正在寫出建議…'}});
  if(!data||!Array.isArray(data.order))throw{code:'invalid_json'};
  const seen=new Set(data.order.map(o=>String(o.id)));
  list.forEach(x=>{if(!seen.has(x.r.id))data.order.push({id:x.r.id,reason:'',next:''})});
  data.order=data.order.map(o=>({id:String(o.id),reason:String(o.reason||''),next:String(o.next||'')}));
  AI={state:'done',data:{summary:String(data.summary||''),order:data.order},at:Date.now(),sig:sig(),err:''};
 }catch(e){
  const c=e&&e.code;
  if(c==='cancelled'){AI.state='idle';AI.err=''}
  else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){AI.state='off';AI.err=''}
  else{AI.state='idle';AI.err=c==='rate_limited'?'AI 使用次數暫時達到上限，請稍後再試。':c==='invalid_json'?'AI 回覆的格式不對，請再按一次。':'AI 暫時無法回應，請稍後再試。'}
 }
 if(V.name==='urgent')render();
}

/* ---------- photos ---------- */
function shrink(file){return new Promise(res=>{
 const url=URL.createObjectURL(file);const img=new Image();
 img.onload=()=>{const M=1280;let{width:w,height:h}=img;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72))};
 img.onerror=()=>{URL.revokeObjectURL(url);res(null)};img.src=url})}
async function onPhotos(e){
 const files=[...e.target.files];if(!files.length)return;
 toast('處理照片中…');
 for(const f of files){const d=await shrink(f);if(d)D.photos.push(d)}
 render();
}

window.addEventListener('resize',()=>{const nav=document.getElementById('nav');nav.hidden=BARE.includes(V.name)||(V.name==='new'||V.name==='pform')&&innerWidth<900});

setInterval(()=>{if(document.visibilityState==='visible')sync()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
AI.state=window.claude?'idle':'off';
getSample().then(x=>{if(!x)AI.state='off'});
boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
